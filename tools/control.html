<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jay 远程画面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#eef4f8;font:16px system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:16px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0 auto 0 0}button,select{font:inherit;padding:8px 14px;border:1px solid #647686;border-radius:8px;background:#26394a;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}#state{color:#b5c1cc}p,small{color:#b5c1cc;line-height:1.5}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border:2px solid #3e5060;border-radius:10px;outline:none;cursor:default}img.active{border-color:#64ce96;cursor:none}#error{color:#ff9999;min-height:24px;margin:8px 0}
</style>
<main><header><h1>Jay · HDMI 远程画面</h1><span id="state">正在连接</span>
<label>帧率 <select id="fps"><option>5</option><option selected>10</option><option>20</option></select></label>
<button id="arm" disabled>启用键鼠</button><button id="pause" disabled>停止控制</button><button id="cad" disabled>Ctrl + Alt + Del</button><button id="window" disabled>当前窗口移到 HDMI</button></header>
<p id="error"></p>
<img id="view" tabindex="0" draggable="false" alt="Jay HDMI 实时画面">
<small>启用后鼠标指到哪里,远程指针就到哪里,点击、右键、滚轮直接用;键盘(包括 Esc)全部发给远程。点“停止控制”或关闭页面即释放。
鼠标定位要求 HDMI 是 Windows 的主屏或唯一屏幕(拔掉 DP 即可);Windows 把绝对定位鼠标只映射到主屏。</small></main>
<script type="module">
import {toAbsolute, LatestMotion} from '/pointer.mjs';
const $ = id => document.getElementById(id);
const view = $('view'), arm = $('arm'), pauseButton = $('pause'), statusLabel = $('state'), error = $('error'), fps = $('fps');
let socket = null, keys = {}, pressed = new Set(), buttons = new Set(), mouseReady = false, pinger = null;
const controlling = () => socket?.readyState === WebSocket.OPEN;
const send = data => { if (controlling()) socket.send(JSON.stringify(data)); };
const motion = new LatestMotion(p => send({kind: 'abs', ...p}), () => socket.bufferedAmount > 512);
(function pump() { if (controlling()) motion.flush(); requestAnimationFrame(pump); })();

try { fps.value = localStorage.getItem('jay-fps') || fps.value; } catch {}
const startStream = () => { view.src = '/stream?fps=' + fps.value; };
fps.onchange = () => { try { localStorage.setItem('jay-fps', fps.value); } catch {} startStream(); };
startStream();
fetch('/keymap').then(r => r.json()).then(d => { keys = d; }).catch(() => { error.textContent = '键盘映射载入失败'; });

function releaseHeld() {
  for (const code of pressed) send({kind: 'key', code: keys[code], down: false});
  for (const button of buttons) send({kind: 'button', button, down: false});
  pressed.clear(); buttons.clear();
}
function setControls(on) {
  view.classList.toggle('active', on);
  arm.disabled = on; pauseButton.disabled = !on; $('cad').disabled = !on; $('window').disabled = !on;
}
function stop() {
  releaseHeld(); motion.clear(); clearInterval(pinger);
  if (socket) socket.close();
  socket = null; setControls(false);
}
arm.onclick = () => {
  error.textContent = '';
  const ws = new WebSocket(`ws://${location.host}/ws`);
  socket = ws;
  ws.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.type === 'armed') { setControls(true); view.focus(); pinger = setInterval(() => send({kind: 'ping'}), 500); }
    else if (message.type === 'error') error.textContent = message.error;
  };
  ws.onclose = () => { if (socket === ws) stop(); };
};
pauseButton.onclick = stop;
function chord(names) {
  for (const name of names) send({kind: 'key', code: keys[name], down: true});
  for (const name of [...names].reverse()) send({kind: 'key', code: keys[name], down: false});
  view.focus();
}
$('cad').onclick = () => chord(['ControlLeft', 'AltLeft', 'Delete']);
$('window').onclick = () => chord(['MetaLeft', 'ShiftLeft', 'ArrowRight']);

const position = e => view.naturalWidth ? toAbsolute(view.getBoundingClientRect(), {width: view.naturalWidth, height: view.naturalHeight}, e.clientX, e.clientY) : null;
view.addEventListener('pointermove', e => { if (controlling() && mouseReady) { const p = position(e); if (p) motion.push(p); } });
view.addEventListener('pointerdown', e => {
  if (!controlling() || !mouseReady || ![0, 1, 2].includes(e.button)) return;
  e.preventDefault(); view.focus();
  const p = position(e); if (!p) return;
  motion.clear(); send({kind: 'abs', ...p});  // land on the clicked point first
  buttons.add(e.button); send({kind: 'button', button: e.button, down: true});
});
document.addEventListener('pointerup', e => { if (buttons.delete(e.button)) send({kind: 'button', button: e.button, down: false}); });
view.oncontextmenu = e => e.preventDefault();
view.addEventListener('wheel', e => { if (controlling() && mouseReady) { e.preventDefault(); send({kind: 'wheel', dy: e.deltaY > 0 ? -1 : 1}); } }, {passive: false});
view.addEventListener('keydown', e => {
  if (!controlling() || !keys[e.code]) return;
  e.preventDefault();
  if (e.repeat || pressed.has(e.code)) return;
  pressed.add(e.code); send({kind: 'key', code: keys[e.code], down: true});
});
document.addEventListener('keyup', e => { if (pressed.delete(e.code)) { e.preventDefault(); send({kind: 'key', code: keys[e.code], down: false}); } });
// Leaving the page must not leave a key held on the remote; control stays on.
window.addEventListener('blur', releaseHeld);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseHeld(); });

setInterval(async () => {
  try {
    const s = await (await fetch('/status')).json();
    const online = s.usb_connected && s.keyboard_online && !s.error;
    mouseReady = !!s.mouse_online && s.mouse_mode === 8;
    statusLabel.textContent = s.error ? '控制连接中断' : !online ? (s.video_ready ? '画面在线 · Windows USB 未连接' : '等待画面与 Windows USB')
      : s.keyboard_boot_protocol ? 'BIOS 模式:只有键盘(Tab、方向键、Enter)' : mouseReady ? '画面与键鼠在线' : '画面与键盘在线 · 鼠标不可用';
    statusLabel.style.color = s.error ? '#ff9999' : online ? '#64ce96' : '#b5c1cc';
    if (!controlling()) arm.disabled = !online || !keys.Enter || (s.armed && !socket);
    if (s.error) error.textContent = s.error;
  } catch { statusLabel.textContent = '连接中断'; statusLabel.style.color = '#ff9999'; }
}, 1000);
</script>
</html>
