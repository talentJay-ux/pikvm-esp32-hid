<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jay 远程画面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#eef4f8;font:16px system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:0 auto 0 0}button{font:inherit;padding:10px 18px;border:1px solid #647686;border-radius:8px;background:#26394a;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}#state{color:#b5c1cc}p{color:#b5c1cc;line-height:1.5}img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border:2px solid #3e5060;border-radius:10px;outline:none}img.active{border-color:#64ce96}#error{color:#ff9999;min-height:24px}small{display:block;color:#b5c1cc;margin-top:12px}
</style>
<main><header><h1>Jay · HDMI 远程画面</h1><span id="state">正在连接</span><button id="arm" disabled>启用键鼠</button><button id="pause" disabled>暂停控制</button><button id="escape" disabled>发送 Esc</button><button id="login" disabled>Ctrl + Alt + Del</button></header>
<p>默认只观看。键鼠与 Windows 本地操作共享焦点，启用前请停止本地操作。</p>
<img id="view" tabindex="0" draggable="false" style="touch-action:none" src="/stream" alt="Jay HDMI 实时画面">
<p><button id="left" disabled>左键</button> <button id="right" disabled>右键</button> <button id="window" disabled>将当前窗口移到 HDMI</button></p>
<small id="mouseHelp">启用后拖动画面移动指针，轻点画面点击；按 Esc 暂停控制。</small><p id="error"></p></main>
<script type="module">
import {InputQueue} from '/input.mjs';
const view=document.querySelector('#view'), arm=document.querySelector('#arm'), pauseButton=document.querySelector('#pause'), statusLabel=document.querySelector('#state'), error=document.querySelector('#error');
const escapeButton=document.querySelector('#escape'),loginButton=document.querySelector('#login');
const leftButton=document.querySelector('#left'),rightButton=document.querySelector('#right'),windowButton=document.querySelector('#window');
let token=null,pressed=new Set(),drag=null;
const canLock=typeof view.requestPointerLock==='function';
if(canLock)document.querySelector('#mouseHelp').textContent='启用后点击画面锁定鼠标；按 Esc 暂停控制。';
async function post(action,data={},lease=token){const r=await fetch('/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,token:lease})});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
const queue=new InputQueue((data,lease)=>post('input',data,lease),()=>token,(e,lease)=>{if(token===lease){error.textContent=e.message;pause()}});
function clearLocal(){token=null;pressed.clear();drag=null;queue.clear();view.classList.remove('active');arm.disabled=true;for(const b of [pauseButton,escapeButton,loginButton,leftButton,rightButton,windowButton])b.disabled=true;if(document.pointerLockElement)document.exitPointerLock()}
function pause(){const previous=token;clearLocal();if(previous)fetch('/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:previous})}).catch(()=>{})}
function input(data){queue.push(data)}
arm.onclick=async()=>{try{const d=await post('arm');token=d.token;arm.disabled=true;for(const b of [pauseButton,escapeButton,loginButton,leftButton,rightButton,windowButton])b.disabled=false;view.classList.add('active');view.focus();error.textContent=''}catch(e){error.textContent=e.message}};
pauseButton.onclick=pause;
function chord(names){for(const name of names)input({kind:'key',code:keys[name],down:true});for(const name of [...names].reverse())input({kind:'key',code:keys[name],down:false});view.focus()}
escapeButton.onclick=()=>chord(['Escape']);loginButton.onclick=()=>chord(['ControlLeft','AltLeft','Delete']);
function clickRemote(button){input({kind:'button',button,down:true});input({kind:'button',button,down:false});view.focus()}
leftButton.onclick=()=>clickRemote(0);rightButton.onclick=()=>clickRemote(2);windowButton.onclick=()=>chord(['MetaLeft','ShiftLeft','ArrowRight']);
view.onclick=()=>{if(token&&canLock&&!document.pointerLockElement){try{const result=view.requestPointerLock();if(result?.catch)result.catch(e=>{error.textContent=e.message})}catch(e){error.textContent=e.message}}};
view.addEventListener('pointerdown',e=>{if(!token||canLock||e.button!==0)return;e.preventDefault();view.focus();drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};if(typeof view.setPointerCapture==='function')view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!token||!drag||drag.id!==e.pointerId)return;const dx=Math.round(e.clientX-drag.x),dy=Math.round(e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;if(dx||dy){drag.moved=true;input({kind:'move',dx:Math.max(-127,Math.min(127,dx)),dy:Math.max(-127,Math.min(127,dy))})}});
document.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved;drag=null;if(!moved)clickRemote(0)});
view.addEventListener('pointercancel',()=>{drag=null});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&token)pause()});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===view)input({kind:'move',dx:Math.max(-127,Math.min(127,Math.round(e.movementX))),dy:Math.max(-127,Math.min(127,Math.round(e.movementY)))})});
for(const [event,down] of [['mousedown',true],['mouseup',false]])document.addEventListener(event,e=>{if(document.pointerLockElement===view&&e.button<=2){e.preventDefault();input({kind:'button',button:e.button,down})}});
view.oncontextmenu=e=>e.preventDefault();
view.addEventListener('wheel',e=>{if(token){e.preventDefault();input({kind:'wheel',dy:e.deltaY>0?-1:1})}},{passive:false});
let keys={};fetch('/keymap').then(r=>r.json()).then(d=>{keys=d}).catch(e=>{error.textContent='键盘映射载入失败'}) ;
view.addEventListener('keydown',e=>{if(!token)return;if(e.code==='Escape'){e.preventDefault();pause();return}if(keys[e.code]&&!e.repeat){e.preventDefault();pressed.add(e.code);input({kind:'key',code:keys[e.code],down:true})}});
document.addEventListener('keyup',e=>{if(token&&pressed.delete(e.code)){e.preventDefault();input({kind:'key',code:keys[e.code],down:false})}});
window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
setInterval(async()=>{if(token)try{await post('heartbeat')}catch(e){error.textContent=e.message;pause()}},500);
setInterval(async()=>{try{const s=await(await fetch('/status')).json();const online=s.usb_connected&&!s.error;statusLabel.textContent=s.error?'控制连接中断':online?(s.video_ready?'画面与键鼠在线':'键鼠在线 · 等待画面'):(s.video_ready?'画面在线 · Windows USB 未连接':'等待画面与 Windows USB');statusLabel.style.color=s.error?'#ff9999':online?'#64ce96':'#b5c1cc';if(token&&!s.armed)clearLocal();if(!token)arm.disabled=!online||!keys.Enter;if(s.error)error.textContent=s.error;else error.textContent=''}catch(e){statusLabel.textContent='连接中断';statusLabel.style.color='#ff9999';pause()}},1000);
</script>
</html>
